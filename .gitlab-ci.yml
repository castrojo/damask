include: "https://gitlab.gnome.org/GNOME/citemplates/raw/master/flatpak/flatpak_ci_initiative.yml"

.vars-devel:
  variables:
    MANIFEST_PATH: "app.drey.Damask.Devel.json"
    FLATPAK_MODULE: "damask"
    APP_ID: "app.drey.Damask.Devel"
    RUNTIME_REPO: "https://nightly.gnome.org/gnome-nightly.flatpakrepo"
    BUNDLE: "app.drey.Damask.Devel.flatpak"

# Build Flatpak for x86_64
flatpak@x86_64:
  extends: ['.flatpak@x86_64', '.vars-devel']

# Build Flatpak for aarch64
flatpak@aarch64:
  extends: ['.flatpak@aarch64', '.vars-devel']

nightly@x86_64:
  extends: '.publish_nightly'
  # assuming your job in named 'flatpak@x86_64'
  needs: ['flatpak@x86_64']

nightly@aarch64:
  extends: '.publish_nightly'
  # assuming your job in named 'flatpak@aach64'
  needs: ['flatpak@aarch64']
